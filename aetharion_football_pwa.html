<!DOCTYPE html>
<html lang="tr" class="h-full bg-slate-900 text-white select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aetharion Football - 2D Soccer PWA</title>
    <!-- PWA Manifest Data Dynamic URL -->
    <link rel="manifest" id="manifest-placeholder">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; touch-action: none; overflow: hidden; }
        .font-game { font-family: 'Teko', sans-serif; }
        canvas { background-color: #1b4332; touch-action: none; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .btn-glow { box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        .btn-glow:active { transform: scale(0.96); }
        /* Virtual Controls Styling */
        .touch-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(4px);
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            user-select: none;
        }
        .touch-btn:active { background: rgba(34, 197, 94, 0.5); border-color: #22c55e; }
    </style>
</head>
<body class="h-full flex flex-col justify-between overflow-hidden relative">

    <!-- Top HUD Bar -->
    <div id="hud" class="hidden absolute top-0 left-0 w-full z-10 p-3 flex justify-between items-center pointer-events-none">
        <!-- Team 1 -->
        <div class="glass-panel px-4 py-1.5 rounded-2xl flex items-center gap-3 border-l-4 border-emerald-500 pointer-events-auto">
            <span class="font-game text-2xl font-bold tracking-wide text-emerald-400">AETHARION</span>
            <span id="score-home" class="font-game text-4xl font-extrabold text-white">0</span>
        </div>
        
        <!-- Timer & Period -->
        <div class="glass-panel px-5 py-1.5 rounded-full flex flex-col items-center pointer-events-auto">
            <div id="game-time" class="font-game text-3xl leading-none text-yellow-400">03:00</div>
            <div id="game-mode-tag" class="text-[10px] uppercase font-bold text-slate-400 tracking-wider">5v5 MAÇ</div>
        </div>

        <!-- Team 2 -->
        <div class="glass-panel px-4 py-1.5 rounded-2xl flex items-center gap-3 border-r-4 border-rose-500 pointer-events-auto">
            <span id="score-away" class="font-game text-4xl font-extrabold text-white">0</span>
            <span class="font-game text-2xl font-bold tracking-wide text-rose-400">RİVALS</span>
        </div>
    </div>

    <!-- Canvas Container -->
    <div class="relative w-full h-full flex items-center justify-center">
        <canvas id="gameCanvas" class="w-full h-full object-contain"></canvas>

        <!-- Overlay: Main Menu -->
        <div id="menu-overlay" class="absolute inset-0 z-20 flex items-center justify-center bg-slate-950/80 backdrop-blur-md p-4">
            <div class="glass-panel p-6 sm:p-8 rounded-3xl max-w-md w-full text-center flex flex-col gap-5 border border-slate-700/50 shadow-2xl">
                <div>
                    <h1 class="font-game text-6xl font-extrabold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400">
                        AETHARION
                    </h1>
                    <p class="text-xs font-semibold text-slate-400 tracking-widest uppercase">Futbol Şampiyonası</p>
                </div>

                <!-- Gold / Coins Counter -->
                <div class="flex justify-center items-center gap-2 bg-slate-800/60 py-2 px-4 rounded-xl border border-slate-700/50 self-center">
                    <i class="fa-solid fa-coins text-yellow-400 text-lg"></i>
                    <span id="gold-display" class="font-game text-2xl font-bold text-yellow-400">100</span>
                    <span class="text-xs text-slate-400 font-medium">Altın</span>
                </div>

                <!-- Game Mode Buttons -->
                <div class="flex flex-col gap-3">
                    <button id="btn-mode-5v5" onclick="startGame('5v5')" class="py-3 px-5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 font-extrabold text-lg tracking-wide transition shadow-lg btn-glow flex items-center justify-between">
                        <span><i class="fa-solid fa-users mr-2"></i> 5
